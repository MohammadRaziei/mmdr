[package]
name = "mmdr-python"
version = "0.3.0"
edition = "2021"
authors = ["Mohammad Raziei <mohammadraziei1375@gmail.com>"]
description = "Python bindings for Mermaid rendering — two SVG backends; rasterization is done in Python via novasvg"
license = "MIT"
repository = "https://github.com/mohammadraziei/mmdr"
homepage = "https://github.com/mohammadraziei/mmdr"

[lib]
name = "_mmdr"
crate-type = ["cdylib"]

[features]
default = ["backend-mermaid-rs", "backend-merman"]
backend-mermaid-rs = ["dep:mermaid-rs-renderer"]
backend-merman     = ["dep:merman"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

# SVG backends (optional)
mermaid-rs-renderer = { version = "0.3.1", optional = true, default-features = false }
merman              = { version = "0.9.0",  optional = true }

[profile.release]
lto   = true
strip = true
