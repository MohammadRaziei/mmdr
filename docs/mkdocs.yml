site_name: mmdr
site_description: Fast, native Mermaid diagram rendering for Python — no browser required
site_url: https://MohammadRaziei.github.io/mmdr
repo_url: https://github.com/MohammadRaziei/mmdr
repo_name: MohammadRaziei/mmdr
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - scheme: slate  
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default     
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            docstring_style: google

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Examples: examples.md
  - Reference:
    - CLI: cli.md
    - Python API: api.md
    - Backends: backends.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MohammadRaziei/mmdr

copyright: Copyright &copy; 2026-present Mohammad Raziei
